# WE Brand — force light theme so our custom CSS is readable
# regardless of the user's OS / browser dark-mode preference.

[theme]
base                  = "light"
primaryColor          = "#5B2083"   # WE purple
backgroundColor       = "#FFFFFF"   # main page
secondaryBackgroundColor = "#F7F5FC" # cards / sidebar tint
textColor             = "#1A1A2E"   # dark navy-black body text
font                  = "sans serif"

[client]
toolbarMode = "minimal"   # hide the deploy / settings clutter at top-right

[server]
headless = true
